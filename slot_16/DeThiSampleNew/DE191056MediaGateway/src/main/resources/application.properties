spring.application.name=DE191056MediaGateway
server.port=8080

# -- Routes --
# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
# Post Service
spring.cloud.gateway.server.webflux.routes[1].id=post-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/posts/**

# -- Swagger / SpringDoc --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Aggregate the downstream service docs in the gateway Swagger UI
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs
# CORS is configured in CorsConfig.java via CorsWebFilter
