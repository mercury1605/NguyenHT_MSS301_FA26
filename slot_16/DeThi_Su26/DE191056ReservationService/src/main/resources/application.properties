spring.application.name=DE191056ReservationService
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# @JsonFormat dates use this zone; must match the JVM zone used when reading DATE columns
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Base URL of RoomService (consumed by the OpenFeign client)
room.service.url=http://localhost:8081

# -- OpenFeign config for client "room-service" --
spring.cloud.openfeign.client.config.room-service.connect-timeout=3000
spring.cloud.openfeign.client.config.room-service.read-timeout=5000

# -- Swagger / SpringDoc --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
